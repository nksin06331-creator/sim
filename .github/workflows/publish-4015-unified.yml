name: Publish 4015 unified report

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/publish-report-package-unified-v5.mjs"
      - "report-system/reports/4015.report.json"
      - "report-system/catalysts/4015.catalyst.json"
      - "report-system/templates/**"
      - "report-system/src/**"
      - ".github/workflows/publish-4015-unified.yml"

permissions:
  contents: write

concurrency:
  group: publish-4015-unified
  cancel-in-progress: false

jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate and generate direct unified report
        run: node scripts/publish-report-package-unified-v5.mjs report-system/reports/4015.report.json

      - name: Verify unified page contract
        shell: bash
        run: |
          set -euo pipefail
          test -f stocks/4015/index.html
          test -f stocks/4015/4015.html
          test -f stocks/4015/catalysts.html
          grep -q 'data-view-btn="guide"' stocks/4015/index.html
          grep -q 'data-view-btn="scenario"' stocks/4015/index.html
          grep -q 'data-view-btn="catalyst"' stocks/4015/index.html
          grep -q 'data-view="guide"' stocks/4015/index.html
          grep -q 'data-view="scenario"' stocks/4015/index.html
          grep -q 'data-view="catalyst"' stocks/4015/index.html
          ! grep -qi '<iframe' stocks/4015/index.html
          grep -q "location.replace('index.html')" stocks/4015/4015.html
          grep -q "location.replace('index.html')" stocks/4015/catalysts.html
          ! grep -q 'href="4015.html"' stocks/4015/index.html
          ! grep -q 'href="catalysts.html"' stocks/4015/index.html
          ! grep -Eq '\{\{[A-Z0-9_]+\}\}' stocks/4015/index.html

      - name: Commit generated files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stocks/4015 report-system/published/4015.report.json
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "Publish 4015 with direct unified report layout"
          git push origin HEAD:main
