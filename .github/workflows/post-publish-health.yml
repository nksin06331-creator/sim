name: Post-publish health and rollback

on:
  workflow_run:
    workflows: ["Build hybrid portal and deploy Pages"]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: post-publish-health
  cancel-in-progress: false

jobs:
  health:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2
          token: ${{ secrets.SIM_AUTOMATION_TOKEN || github.token }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Wait for Pages edge propagation
        run: sleep 20
      - name: Health check
        id: health
        continue-on-error: true
        run: node scripts/health-check.mjs
      - name: Roll back the exact failed publication commit
        if: steps.health.outcome == 'failure'
        env:
          SIM_AUTOMATION_TOKEN: ${{ secrets.SIM_AUTOMATION_TOKEN }}
        shell: bash
        run: |
          if [ -z "$SIM_AUTOMATION_TOKEN" ]; then
            echo "AUTO_HOLD: SIM_AUTOMATION_TOKEN is not configured; rollback cannot push."
            exit 1
          fi
          expected="${{ github.event.workflow_run.head_sha }}"
          actual=$(git rev-parse HEAD)
          if [ "$actual" != "$expected" ]; then
            echo "AUTO_HOLD: main advanced; refusing to revert an unrelated commit."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git revert --no-edit "$expected"
          git push origin main
      - name: Fail after rollback request
        if: steps.health.outcome == 'failure'
        run: exit 1
