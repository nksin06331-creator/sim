name: Validate and auto-publish report candidate

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "report-system/reports/*.report.json"
      - "report-system/reports/*.catalyst.json"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: report-${{ github.event.pull_request.head.repo.full_name }}-${{ github.event.pull_request.head.ref }}
  cancel-in-progress: false

jobs:
  gate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_VALIDATION_MODEL: ${{ vars.OPENAI_VALIDATION_MODEL || 'gpt-5.6-terra' }}
      SIM_AUTOMATION_TOKEN: ${{ secrets.SIM_AUTOMATION_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
          token: ${{ secrets.SIM_AUTOMATION_TOKEN || github.token }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Resolve one report candidate
        id: candidate
        shell: bash
        run: |
          git fetch origin "${{ github.event.pull_request.base.ref }}"
          mapfile -t reports < <(git diff --name-only "origin/${{ github.event.pull_request.base.ref }}...HEAD" -- 'report-system/reports/*.report.json')
          if [ "${#reports[@]}" -ne 1 ]; then
            echo "Exactly one TICKER.report.json must change per PR; found ${#reports[@]}."
            exit 1
          fi
          echo "path=${reports[0]}" >> "$GITHUB_OUTPUT"
          echo "ticker=$(basename "${reports[0]}" .report.json)" >> "$GITHUB_OUTPUT"
      - name: Require autonomous publication credentials
        id: credentials
        run: |
          if [ -z "$SIM_AUTOMATION_TOKEN" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "AUTO_HOLD: SIM_AUTOMATION_TOKEN is not configured."
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Independent validation
        id: independent
        continue-on-error: true
        run: node scripts/independent-validate.mjs "${{ steps.candidate.outputs.path }}" independent-validation.json
      - name: Deterministic gates
        id: gates
        continue-on-error: true
        run: node scripts/auto-publish.mjs validate "${{ steps.candidate.outputs.path }}" independent-validation.json
      - name: Upload hold audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-gates-${{ steps.candidate.outputs.ticker }}
          path: |
            independent-validation.json
            report-system/audit/${{ steps.candidate.outputs.ticker }}/
      - name: Promote candidate and generate site files
        if: steps.gates.outputs.decision == 'AUTO_PUBLISH' && steps.credentials.outputs.available == 'true'
        shell: bash
        run: |
          status=$(node -e "console.log(require('./${{ steps.candidate.outputs.path }}').status)")
          if [ "$status" != "published" ]; then
            node scripts/auto-publish.mjs promote "${{ steps.candidate.outputs.path }}" independent-validation.json
          fi
      - name: Regression tests and preview build
        if: steps.gates.outputs.decision == 'AUTO_PUBLISH' && steps.credentials.outputs.available == 'true'
        run: |
          node --test report-system/tests/*.test.mjs
          node scripts/catalyst-ops.mjs registry
          node scripts/build-pages.mjs
      - name: Commit generated files for a first-pass candidate
        if: steps.gates.outputs.decision == 'AUTO_PUBLISH' && steps.credentials.outputs.available == 'true'
        id: generated
        shell: bash
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add report-system/reports report-system/published report-system/history report-system/audit stocks data/manifest.json lab/data/manifest.json data/catalyst-reports.json
          git commit -m "chore: generate ${{ steps.candidate.outputs.ticker }} publication"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Auto-merge validated candidate
        if: steps.gates.outputs.decision == 'AUTO_PUBLISH' && steps.credentials.outputs.available == 'true'
        env:
          GH_TOKEN: ${{ secrets.SIM_AUTOMATION_TOKEN }}
        run: |
          gh pr ready "${{ github.event.pull_request.number }}" || true
          gh pr merge "${{ github.event.pull_request.number }}" --repo "${{ github.repository }}" --squash --delete-branch
      - name: Enforce AUTO_HOLD
        if: steps.gates.outputs.decision != 'AUTO_PUBLISH' || steps.credentials.outputs.available != 'true'
        run: |
          echo "AUTO_HOLD: one or more V6 gates did not pass with zero warnings."
          exit 1
