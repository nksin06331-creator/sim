name: Validate and auto-publish report candidate

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "report-system/reports/*.report.json"
      - "report-system/reports/*.catalyst.json"

permissions:
  contents: write
  pull-requests: write
  models: read
  pages: write
  id-token: write

concurrency:
  group: report-${{ github.event.pull_request.head.repo.full_name }}-${{ github.event.pull_request.head.ref }}
  cancel-in-progress: false

jobs:
  gate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      published: ${{ steps.merge.outputs.published }}
      merge_sha: ${{ steps.merge.outputs.merge_sha }}
      ticker: ${{ steps.candidate.outputs.ticker }}
    env:
      GITHUB_TOKEN: ${{ github.token }}
      GITHUB_VALIDATION_MODEL: ${{ vars.GITHUB_VALIDATION_MODEL || 'openai/gpt-4.1' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
          token: ${{ github.token }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Resolve one report candidate
        id: candidate
        shell: bash
        run: |
          git fetch origin "${{ github.event.pull_request.base.ref }}"
          mapfile -t reports < <(git diff --name-only "origin/${{ github.event.pull_request.base.ref }}...HEAD" -- 'report-system/reports/*.report.json')
          if [ "${#reports[@]}" -ne 1 ]; then
            echo "Exactly one TICKER.report.json must change per PR; found ${#reports[@]}."
            exit 1
          fi
          echo "path=${reports[0]}" >> "$GITHUB_OUTPUT"
          echo "ticker=$(basename "${reports[0]}" .report.json)" >> "$GITHUB_OUTPUT"
      - name: Independent validation with GitHub Models
        id: independent
        continue-on-error: true
        run: node scripts/independent-validate.mjs "${{ steps.candidate.outputs.path }}" independent-validation.json
      - name: Deterministic gates
        id: gates
        continue-on-error: true
        run: node scripts/auto-publish.mjs validate "${{ steps.candidate.outputs.path }}" independent-validation.json
      - name: Upload validation audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-gates-${{ steps.candidate.outputs.ticker }}
          path: |
            independent-validation.json
            report-system/audit/${{ steps.candidate.outputs.ticker }}/
      - name: Enforce AUTO_HOLD
        if: steps.gates.outputs.decision != 'AUTO_PUBLISH'
        run: |
          echo "AUTO_HOLD: one or more V6 gates did not pass with zero warnings."
          exit 1
      - name: Promote candidate and generate site files
        if: steps.gates.outputs.decision == 'AUTO_PUBLISH'
        run: node scripts/auto-publish.mjs promote "${{ steps.candidate.outputs.path }}" independent-validation.json
      - name: Regression tests and preview build
        if: steps.gates.outputs.decision == 'AUTO_PUBLISH'
        run: |
          node --test report-system/tests/*.test.mjs
          node scripts/catalyst-ops.mjs registry
          node scripts/build-pages.mjs
      - name: Prepare Pages artifact
        if: steps.gates.outputs.decision == 'AUTO_PUBLISH'
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        if: steps.gates.outputs.decision == 'AUTO_PUBLISH'
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"
      - name: Commit machine-generated publication
        if: steps.gates.outputs.decision == 'AUTO_PUBLISH'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add report-system/reports report-system/published report-system/history report-system/audit report-system/catalysts stocks data/manifest.json lab/data/manifest.json data/catalyst-reports.json
          git commit -m "chore: generate ${{ steps.candidate.outputs.ticker }} publication"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
      - name: Merge validated candidate
        if: steps.gates.outputs.decision == 'AUTO_PUBLISH'
        id: merge
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh pr ready "${{ github.event.pull_request.number }}" || true
          gh pr merge "${{ github.event.pull_request.number }}" --repo "${{ github.repository }}" --squash --delete-branch
          merge_sha=$(gh pr view "${{ github.event.pull_request.number }}" --repo "${{ github.repository }}" --json mergeCommit --jq '.mergeCommit.oid')
          echo "published=true" >> "$GITHUB_OUTPUT"
          echo "merge_sha=$merge_sha" >> "$GITHUB_OUTPUT"

  deploy:
    if: needs.gate.outputs.published == 'true'
    needs: gate
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy generated Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4

  health:
    if: needs.gate.outputs.published == 'true'
    needs: [gate, deploy]
    permissions:
      contents: write
      actions: write
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2
          token: ${{ github.token }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Wait for Pages edge propagation
        run: sleep 20
      - name: Health check
        id: health
        continue-on-error: true
        run: node scripts/health-check.mjs
      - name: Roll back exact failed publication and dispatch recovery deploy
        if: steps.health.outcome == 'failure'
        shell: bash
        run: |
          expected="${{ needs.gate.outputs.merge_sha }}"
          actual=$(git rev-parse HEAD)
          if [ "$actual" != "$expected" ]; then
            echo "AUTO_HOLD: main advanced; refusing to revert an unrelated commit."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git revert --no-edit "$expected"
          git push origin main
          gh workflow run hybrid-pages.yml --repo "${{ github.repository }}" --ref main
      - name: Fail after rollback request
        if: steps.health.outcome == 'failure'
        run: exit 1
