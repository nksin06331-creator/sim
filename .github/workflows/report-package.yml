name: Build report publication package

on:
  pull_request:
    paths:
      - "report-system/reports/*.report.json"
      - "report-system/reports/*.catalyst.json"
      - "report-system/catalysts/*.catalyst.json"
      - "scripts/publish-report-package-unified-v5.mjs"
      - "report-system/src/unified-render.mjs"
      - "report-system/src/validate.mjs"
      - "report-system/src/catalyst.mjs"
      - "report-system/src/schema.mjs"
      - "report-system/schemas/*.schema.json"
      - "report-system/template-bindings.json"
      - "report-system/templates/template_report_unified_v5.html"
      - "report-system/templates/redirect_*.html"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/report-package.yml"

permissions:
  contents: write

jobs:
  package:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install validation dependencies
        run: npm ci
      - name: Find changed report JSON files
        id: reports
        shell: bash
        run: |
          {
            git diff --name-only "${{ github.event.pull_request.base.sha }}" HEAD -- 'report-system/reports/*.report.json'
            git diff --name-only "${{ github.event.pull_request.base.sha }}" HEAD -- 'report-system/reports/*.catalyst.json' \
              | sed -E 's#report-system/reports/(.+)\.catalyst\.json#report-system/reports/\1.report.json#'
            git diff --name-only "${{ github.event.pull_request.base.sha }}" HEAD -- 'report-system/catalysts/*.catalyst.json' \
              | sed -E 's#report-system/catalysts/(.+)\.catalyst\.json#report-system/reports/\1.report.json#'
          } | sort -u > /tmp/reports.txt
          if [ ! -s /tmp/reports.txt ]; then
            echo "No changed report JSON files."
          fi
      - name: Validate and generate complete publication packages
        shell: bash
        run: |
          while IFS= read -r report; do
            [ -z "$report" ] && continue
            node scripts/publish-report-package-unified-v5.mjs "$report"
          done < /tmp/reports.txt
      - name: Verify all reports and build the complete site
        run: |
          npm run report:test
          npm run build
      - name: Commit generated publication files to the PR
        shell: bash
        run: |
          if [ ! -s /tmp/reports.txt ]; then
            echo "No report JSON changed; publication files are not committed."
            exit 0
          fi
          if [ -z "$(git status --porcelain)" ]; then
            echo "Generated files are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stocks report-system/published data/manifest.json lab/data/manifest.json
          git commit -m "Generate complete report publication package"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
