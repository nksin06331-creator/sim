# Existing HTML + per-stock meta.json deployment
name: Build hybrid portal and deploy Pages

on:
  push:
    branches: ["main"]
    paths:
      - "stocks/**"
      - "lab/**"
      - "index.html"
      - "data/**"
      - "scripts/build-pages.mjs"
      - "scripts/catalyst-ops.mjs"
      - "report-system/src/catalyst.mjs"
      - "report-system/templates/catalyst-shell.html"
      - "report-system/schemas/catalyst-report.schema.json"
      - "report-system/catalysts/**"
      - "report-system/reports/*.report.json"
      - "report-system/published/**"
      - "scripts/auto-publish.mjs"
      - "scripts/health-check.mjs"
      - ".github/workflows/hybrid-pages.yml"
      - ".github/workflows/report-auto-publish.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate metadata and build site
        run: |
          node --test report-system/tests/*.test.mjs
          node scripts/catalyst-ops.mjs registry
          node scripts/build-pages.mjs
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
