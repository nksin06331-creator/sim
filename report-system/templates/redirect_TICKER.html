<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex,nofollow">
<title>リダイレクト中...</title>
<script>
// ★ 旧URL互換用リダイレクトファイル
// このファイルは stocks/{{TICKER}}/{{TICKER}}.html に配置される。

// ブラウザ履歴は増やさない（location.replace）。
(function () {
  location.replace('index.html');
})();
</script>
</head>
