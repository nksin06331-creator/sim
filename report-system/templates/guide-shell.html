<script>
(() => {
  const b=document.getElementById('progressBar');
  const u=()=>{const h=document.documentElement.scrollHeight-innerHeight;const s=h>0?scrollY/h:0;b.style.width=Math.min(100,Math.max(0,s*100))+'%'};
  document.addEventListener('scroll',u,{passive:true});window.addEventListener('resize',u);u();
})();
</script>
